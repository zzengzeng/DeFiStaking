name: CI

permissions: {}

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

env:
  FOUNDRY_PROFILE: ci

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run Forge tests
        run: forge test -vvv

  frontend-build:
    name: Frontend production build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.19.0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

  static-analysis:
    name: Slither static analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Build contracts
        run: forge build

      - name: Install Slither
        run: pipx install slither-analyzer

      - name: Run Slither
        run: make static-analysis

  production-readiness:
    name: Production readiness gate
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run production readiness check
        env:
          PRODUCTION: ${{ vars.PRODUCTION }}
          DEPLOYER_ADDRESS: ${{ vars.DEPLOYER_ADDRESS }}
          GOVERNANCE_PROPOSER: ${{ vars.GOVERNANCE_PROPOSER }}
          GOVERNANCE_EXECUTOR: ${{ vars.GOVERNANCE_EXECUTOR }}
          SUPER_PROPOSER: ${{ vars.SUPER_PROPOSER }}
          SUPER_EXECUTOR: ${{ vars.SUPER_EXECUTOR }}
          OPERATOR: ${{ vars.OPERATOR }}
        run: bash script/check-production-readiness.sh
